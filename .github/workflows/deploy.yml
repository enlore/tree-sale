name: deploy-app
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-app
  cancel-in-progress: false
jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: echo "VITE_APP_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"
      - run: npm run build
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - run: gcloud auth print-access-token >/dev/null && echo GCLOUD_TOKEN_OK
      - run: npx firebase-tools deploy --only hosting --non-interactive
